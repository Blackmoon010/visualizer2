<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07070b" />
  <title>BLACKMOON 0-1-0 // v0.9.9c - FINAL RELEASE CANDIDATE</title>
  <style>
    :root {
      --ui-hue: 185;
      --accent: hsl(var(--ui-hue), 100%, 50%);
      --accent-glow: hsla(var(--ui-hue), 100%, 50%, 0.45);
      --accent-dim: hsla(var(--ui-hue), 100%, 50%, 0.15);
      --bg-dark: #07070b;
      --panel-bg: rgba(14, 14, 22, 0.92);
      --panel-border: rgba(255, 255, 255, 0.15);
      --text-main: #f5f5fa;
      --text-muted: #8b8b9e;
      --font-mono: "SF Mono", "Consolas", "Monaco", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #visualizer-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    .screen-fade {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(5, 5, 8, 0.6) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Auto-fading HUD Layer */
    #hud-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.6s ease, visibility 0.6s;
      opacity: 1 !important;
      visibility: visible !important;
    }

    #hud-layer.hud-idle {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    header {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-svg {
      height: 32px;
      width: 44px;
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }

    .brand-title {
      font-size: 1.15rem;
      letter-spacing: 3px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-title span.accent-text {
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .quick-viz-deck {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 4px 10px;
      backdrop-filter: blur(12px);
    }

    .quick-viz-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      min-width: 120px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .deck-container {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 14px;
      max-height: 42vh;
      pointer-events: auto;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      backdrop-filter: blur(16px);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
      flex: 1 1 0px;
      min-width: 250px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 6px;
    }

    .playlist-scroll {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 4px;
    }

    .empty-msg {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 25px;
      line-height: 1.4;
    }

    .queue-item {
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s ease;
      gap: 6px;
    }

    .queue-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }
