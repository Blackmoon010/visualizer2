<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>BLACKMOON 0-1-0 // v0.9.9c - FINAL RELEASE CANDIDATE</title>
  <style>
    :root {
      --ui-hue: 185;
      --accent: hsl(var(--ui-hue), 100%, 50%);
      --accent-glow: hsla(var(--ui-hue), 100%, 50%, 0.45);
      --accent-dim: hsla(var(--ui-hue), 100%, 50%, 0.15);
      --bg-dark: #07070b;
      --panel-bg: rgba(14, 14, 22, 0.94);
      --panel-border: rgba(255, 255, 255, 0.15);
      --text-main: #f5f5fa;
      --text-muted: #8b8b9e;
      --font-mono: "SF Mono", "Consolas", "Monaco", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #visualizer-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    .screen-fade {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(5, 5, 8, 0.6) 100%);
      pointer-events: none;
      z-index: 2;
    }

    #hud-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.6s ease;
      opacity: 1;
    }

    #hud-layer.hud-idle {
      opacity: 0;
    }

    header {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-svg {
      height: 32px;
      width: 44px;
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }

    .brand-title {
      font-size: 1.15rem;
      letter-spacing: 3px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-title span.accent-text {
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }

      color: var(--text-muted);

    }
