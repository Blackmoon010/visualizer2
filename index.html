<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07070b" />
  <title>BLACKMOON 0-1-0 // v1.0.0-rc2 MOBILE LANDSCAPE TWEAKS</title>
  <style>
    :root {
      --ui-hue: 185;
      --accent: hsl(var(--ui-hue), 100%, 50%);
      --accent-glow: hsla(var(--ui-hue), 100%, 50%, 0.45);
      --accent-dim: hsla(var(--ui-hue), 100%, 50%, 0.15);
      --bg-dark: #07070b;
      --panel-bg: rgba(14, 14, 22, 0.94);
      --panel-border: rgba(255, 255, 255, 0.15);
      --text-main: #f5f5fa;
      --text-muted: #8b8b9e;
      --font-mono: "SF Mono", "Consolas", "Monaco", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #visualizer-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    .screen-fade {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(5, 5, 8, 0.6) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Primary HUD layer */
    #hud-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      opacity: 1;
      visibility: visible;
    }

    #hud-layer.hud-idle {
      opacity: 0;
      visibility: hidden;
    }

    /* MOBILE ORIENTATION BRANCHING */
    @media (orientation: portrait) and (max-width: 900px) {
      #hud-layer {
        display: none !important;
      }
      #portrait-hint {
        display: flex !important;
      }
    }

    #portrait-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(14, 14, 22, 0.75);
      border: 1px solid var(--panel-border);
      padding: 8px 16px;
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
      pointer-events: auto;
      transition: opacity 1s ease;
      animation: pulse-hint 4s infinite ease-in-out;
    }

    #portrait-hint span.accent {
      color: var(--accent);
    }

    @keyframes pulse-hint {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }

    header {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-svg {
      height: 32px;
      width: 44px;
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }

    .brand-title {
      font-size: 1.15rem;
      letter-spacing: 3px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-title span.accent-text {
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .quick-viz-deck {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 4px 10px;
      backdrop-filter: blur(12px);
    }

    .quick-viz-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
      min-width: 120px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .deck-container {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 14px;
      max-height: 44vh;
      pointer-events: auto;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      backdrop-filter: blur(16px);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
      flex: 1 1 0px;
      min-width: 250px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 6px;
      flex-shrink: 0;
    }

    /* Scrollable body inside panels */
    .panel-scroll-body {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .playlist-scroll {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 4px;
    }

    .empty-msg {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 25px;
      line-height: 1.4;
    }

    .queue-item {
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s ease;
      gap: 6px;
    }

    .queue-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .queue-item.active {
      background: var(--accent-dim);
      border-left: 3px solid var(--accent);
      color: var(--accent);
    }

    .queue-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn-remove-track {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 4px;
    }

    .btn-remove-track:hover {
      color: #ff5566;
    }

    .transport-center {
      align-items: center;
      justify-content: space-between;
    }

    .now-playing-header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .album-art-thumb {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .album-art-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .album-art-thumb svg {
      width: 24px;
      height: 24px;
      fill: var(--text-muted);
    }

    .track-meta-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .title-wrapper {
      width: 100%;
      overflow: hidden;
      position: relative;
      height: 20px;
      display: flex;
      align-items: center;
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: 0.5px;
      display: inline-block;
    }

    .track-title.marquee {
      position: absolute;
      will-change: transform;
      animation: marquee-scroll 12s linear infinite;
    }

    @keyframes marquee-scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .track-artist {
      font-size: 0.75rem;
      color: var(--accent);
      font-family: var(--font-mono);
      margin-top: 2px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-time {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .seek-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .transport-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .transport-actions-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .vol-box {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .hud-label {
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    button, label.button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover, label.button:hover {
      background: var(--accent);
      color: #050508;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    button.active-toggle {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      gap: 8px;
      flex-shrink: 0;
    }

    select, input[type="range"] {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      border-radius: 4px;
      padding: 3px 6px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      outline: none;
    }

    input[type="range"] {
      -webkit-appearance: none;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      flex: 1;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
      cursor: pointer;
    }

    #file-upload-files, #file-upload-dir, #file-import-viz { display: none; }

    @media (max-width: 900px) and (orientation: landscape) {
      .deck-container {
        max-height: 58vh;
        gap: 8px;
        bottom: 8px;
        left: 8px;
        right: 8px;
      }
      .panel {
        padding: 8px;
        min-width: 180px;
        gap: 6px;
      }
      .panel-scroll-body {
        gap: 6px;
      }
      .control-row {
        font-size: 0.7rem;
        gap: 6px;
      }
      header {
        top: 6px;
        left: 10px;
        right: 10px;
      }
      .brand-title {
        font-size: 0.95rem;
      }
      .brand-sub {
        display: none;
      }
    }
  </style>
</head>
<body>

  <canvas id="visualizer-canvas"></canvas>
  <div class="screen-fade"></div>

  <!-- PORTRAIT PHONE HINT -->
  <div id="portrait-hint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
      <line x1="12" y1="18" x2="12.01" y2="18"></line>
    </svg>
    <span>Rotate to <span class="accent">Landscape</span> for controls</span>
  </div>

  <div id="hud-layer">
    <header>
      <div class="brand-group">
        <svg class="brand-logo-svg" viewBox="0 0 120 72" aria-hidden="true">
          <path d="M38 18c18-2 34 12 36 30-14-8-32-6-44 8 2-16 4-30 8-38z" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M18 44c28-18 62-10 88 8" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="brand-title"><span class="accent-text">BLACK</span>MOON 0-1-0</div>
          <div class="brand-sub">// v1.0.0-rc2 MOBILE LANDSCAPE TWEAKS</div>
        </div>
      </div>

      <div class="quick-viz-deck">
        <button id="btn-quick-prev" type="button" title="Previous Visualizer">‹</button>
        <div id="quick-viz-name" class="quick-viz-title">VORTEX</div>
        <button id="btn-quick-next" type="button" title="Next Visualizer">›</button>
      </div>
    </header>

    <div class="deck-container">
      <!-- PANEL 1: QUEUE -->
      <div class="panel">
        <div class="panel-title">
          <span>Track Queue</span>
          <div style="display: flex; gap: 4px;">
            <label for="file-upload-files" class="button" title="Add Audio Files">+ Files</label>
            <input type="file" id="file-upload-files" multiple accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a" />
            <label for="file-upload-dir" class="button" title="Add Whole Folder">+ Folder</label>
            <input type="file" id="file-upload-dir" webkitdirectory directory multiple />
          </div>
        </div>
        <div class="playlist-scroll" id="queue-container">
          <div class="empty-msg">No tracks loaded.<br>Add audio files or folders to begin.</div>
        </div>
      </div>

      <!-- PANEL 2: TRANSPORT -->
      <div class="panel transport-center">
        <div class="now-playing-header">
          <div class="album-art-thumb" id="art-container">
            <svg id="art-placeholder" viewBox="0 0 24 24">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <img id="art-img" alt="Album Cover" />
          </div>

          <div class="track-meta-wrap">
            <div class="title-wrapper" id="title-box">
              <span class="track-title" id="display-title">READY</span>
            </div>
            <div class="track-artist" id="display-artist">Select a track</div>
            <div class="track-time" id="display-time">00:00 / 00:00</div>
          </div>
        </div>

        <div class="seek-bar-container">
          <input type="range" id="slider-seek" min="0" max="100" step="0.1" value="0" />
        </div>

        <div class="transport-buttons">
          <button id="btn-shuffle" type="button" title="Shuffle Queue">🔀</button>
          <button id="btn-prev" type="button" title="Previous Track">⏮</button>
          <button id="btn-play" type="button" style="min-width: 80px; border-color: var(--accent);" title="Play/Pause">Play</button>
          <button id="btn-next" type="button" title="Next Track">⏭</button>
          <button id="btn-repeat" type="button" title="Repeat Mode">🔁 Off</button>
        </div>

        <div class="transport-actions-row">
          <div class="vol-box">
            <span class="hud-label">VOL</span>
            <input type="range" id="slider-volume" min="0" max="1" step="0.01" value="0.8" />
          </div>
          <button id="btn-fullscreen" type="button" title="Toggle Fullscreen (F11)">⛶ Fullscreen</button>
        </div>
      </div>

      <!-- PANEL 3: CONTROLS (NOW FULLY SCROLLABLE) -->
      <div class="panel">
        <div class="panel-title">
          <span>Engine Controls</span>
          <label for="file-import-viz" class="button" style="padding: 2px 6px; font-size: 0.65rem;" title="Import .milk or .json preset">+ Import Viz</label>
          <input type="file" id="file-import-viz" accept=".milk,.json,.txt" />
        </div>
        
        <div class="panel-scroll-body">
          <div class="control-row">
            <span>Visualizer</span>
            <select id="select-engine">
              <option value="vortex">Vortex</option>
              <option value="warp">Hyperspace (Classic)</option>
              <option value="bars">Spectrum Bars (Grok)</option>
              <option value="cybergrid">Reactive Cyber Grid</option>
              <option value="nebula">Nebula</option>
              <option value="starfield">Starfield (Color)</option>
              <option value="ring">Ring</option>
              <option value="tunnel">Tunnel</option>
              <option value="oscilloscope">Oscilloscope</option>
              <option value="quantum">Quantum Pulse</option>
            </select>
          </div>
          <div class="control-row">
            <span>Speed</span>
            <input type="range" id="slider-speed" min="0.2" max="3.0" step="0.1" value="1.0" />
          </div>
          <div class="control-row">
            <span>Density / Count</span>
            <input type="range" id="slider-density" min="0.2" max="2.5" step="0.1" value="1.0" />
          </div>
          <div class="control-row">
            <span>Bass Reactivity</span>
            <input type="range" id="slider-reactivity" min="0.5" max="3.5" step="0.1" value="1.6" />
          </div>
          <div class="control-row">
            <span>UI Hue Shift</span>
            <input type="range" id="slider-app-hue" min="0" max="360" step="1" value="185" />
          </div>
          <div class="btn-row" style="margin-top: 4px;">
            <button id="btn-save-preset" style="flex: 1;">Save Deck</button>
            <button id="btn-clear-queue" style="flex: 1;">Clear Queue</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    // Immediate canvas sizing to prevent race condition before DOMContentLoaded
    const initialCanvas = document.getElementById("visualizer-canvas");
    if (initialCanvas) {
      initialCanvas.width = window.innerWidth || 1280;
      initialCanvas.height = window.innerHeight || 720;
    }

    window.addEventListener("DOMContentLoaded", () => {
      /* =========================================================
         AUDIO CONTEXT & PIPELINE
         ========================================================= */
      const audio = document.getElementById("audio-player");
      let audioCtx = null;
      let analyser = null;
      let sourceNode = null;
      let gainNode = null;
      let freqData = null;
      let timeData = null;

      function initAudioGraph() {
        if (!audioCtx) {
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.85;

            gainNode = audioCtx.createGain();
            gainNode.gain.value = appState.volume;

            sourceNode = audioCtx.createMediaElementSource(audio);
            sourceNode.connect(analyser);
            analyser.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            freqData = new Uint8Array(analyser.frequencyBinCount);
            timeData = new Uint8Array(analyser.fftSize);
          } catch (e) {
            console.warn("AudioContext init deferred:", e);
          }
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      }

      /* =========================================================
         ID3 METADATA PARSER
         ========================================================= */
      function readID3Tags(file) {
        return new Promise((resolve) => {
          try {
            const headSlice = file.slice(0, 131072);
            const reader = new FileReader();

            reader.onload = (e) => {
              try {
                const buffer = e.target.result;
                const view = new DataView(buffer);

                if (view.byteLength >= 10 && view.getUint8(0) === 0x49 && view.getUint8(1) === 0x44 && view.getUint8(2) === 0x33) {
                  let title = "";
                  let artist = "";
                  let albumArtUrl = null;
                  let offset = 10;
                  const totalSize = Math.min(view.byteLength, 131072);

                  while (offset < totalSize - 10) {
                    const frameId = String.fromCharCode(
                      view.getUint8(offset),
                      view.getUint8(offset + 1),
                      view.getUint8(offset + 2),
                      view.getUint8(offset + 3)
                    );

                    if (!/^[A-Z0-9]{4}$/.test(frameId)) break;

                    const frameSize = view.getUint32(offset + 4);
                    if (frameSize <= 0 || offset + 10 + frameSize > totalSize) break;

                    const encoding = view.getUint8(offset + 10);
                    const frameDataOffset = offset + 11;
                    const frameDataSize = frameSize - 1;

                    if (frameId === "TIT2") {
                      try {
                        const raw = new Uint8Array(buffer, frameDataOffset, frameDataSize);
                        title = (encoding === 1 || encoding === 2 ? new TextDecoder("utf-16") : new TextDecoder("utf-8")).decode(raw).replace(/\0/g, "").trim();
                      } catch (_) {}
                    }

                    if (frameId === "TPE1") {
                      try {
                        const raw = new Uint8Array(buffer, frameDataOffset, frameDataSize);
                        artist = (encoding === 1 || encoding === 2 ? new TextDecoder("utf-16") : new TextDecoder("utf-8")).decode(raw).replace(/\0/g, "").trim();
                      } catch (_) {}
                    }

                    if (frameId === "APIC" && !albumArtUrl) {
                      try {
                        let cursor = frameDataOffset;
                        let mime = "";
                        while (cursor < frameDataOffset + frameDataSize && view.getUint8(cursor) !== 0) {
                          mime += String.fromCharCode(view.getUint8(cursor));
                          cursor++;
                        }
                        cursor++;
                        cursor++;

                        if (encoding === 1 || encoding === 2) {
                          while (cursor < frameDataOffset + frameDataSize - 1) {
                            if (view.getUint8(cursor) === 0 && view.getUint8(cursor + 1) === 0) {
                              cursor += 2;
                              break;
                            }
                            cursor += 2;
                          }
                        } else {
                          while (cursor < frameDataOffset + frameDataSize && view.getUint8(cursor) !== 0) {
                            cursor++;
                          }
                          cursor++;
                        }

                        const imageBytes = new Uint8Array(buffer, cursor, (frameDataOffset + frameDataSize) - cursor);
                        if (imageBytes.length > 0) {
                          const blob = new Blob([imageBytes], { type: mime || "image/jpeg" });
                          albumArtUrl = URL.createObjectURL(blob);
                        }
                      } catch (_) {}
                    }

                    offset += 10 + frameSize;
                  }

                  if (title || artist || albumArtUrl) {
                    return resolve({ title: title || null, artist: artist || null, albumArtUrl });
                  }
                }
              } catch (_) {}
              resolve({ title: null, artist: null, albumArtUrl: null });
            };

            reader.onerror = () => resolve({ title: null, artist: null, albumArtUrl: null });
            reader.readAsArrayBuffer(headSlice);
          } catch (_) {
            resolve({ title: null, artist: null, albumArtUrl: null });
          }
        });
      }

      function parseTrackMeta(fileName) {
        const clean = fileName.replace(/\.[^/.]+$/, "");
        if (clean.includes(" - ")) {
          const parts = clean.split(" - ");
          return {
            artist: parts[0].trim() || "Unknown Artist",
            title: parts.slice(1).join(" - ").trim() || clean
          };
        }
        return { artist: "Unknown Artist", title: clean };
      }

      /* =========================================================
         STATE & CONFIG PERSISTENCE
         ========================================================= */
      const STORAGE_KEY = "bm_100_state";
      const MODES = [
        "vortex", "warp", "bars", "cybergrid", 
        "nebula", "starfield", "ring", "tunnel", 
        "oscilloscope", "quantum"
      ];

      let appState = {
        mode: "vortex",
        speed: 1.0,
        density: 1.0,
        reactivity: 1.6,
        hue: 185,
        shuffle: false,
        repeat: "off",
        volume: 0.8
      };

      function loadSavedConfig() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved) Object.assign(appState, saved);
        } catch (e) {}

        applyAppHue(appState.hue);
        const selEngine = document.getElementById("select-engine");
        if (selEngine) selEngine.value = appState.mode;
        const sSpeed = document.getElementById("slider-speed");
        if (sSpeed) sSpeed.value = appState.speed;
        const sDensity = document.getElementById("slider-density");
        if (sDensity) sDensity.value = appState.density;
        const sReact = document.getElementById("slider-reactivity");
        if (sReact) sReact.value = appState.reactivity;
        const sHue = document.getElementById("slider-app-hue");
        if (sHue) sHue.value = appState.hue;
        const sVol = document.getElementById("slider-volume");
        if (sVol) sVol.value = appState.volume;

        updateQuickVizTitle();
        updateShuffleBtn();
        updateRepeatBtn();
      }

      function saveConfig() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        } catch (e) {}
      }

      function applyAppHue(hueVal) {
        document.documentElement.style.setProperty("--ui-hue", hueVal);
        appState.hue = hueVal;
      }

      /* =========================================================
         AUTO-FADE HUD CONTROLLER
         ========================================================= */
      const hudLayer = document.getElementById("hud-layer");
      let idleTimeout = null;

      function resetIdleTimer() {
        if (!hudLayer) return;
        hudLayer.classList.remove("hud-idle");
        clearTimeout(idleTimeout);
        if (audio && !audio.paused) {
          idleTimeout = setTimeout(() => {
            hudLayer.classList.add("hud-idle");
          }, 3500);
        }
      }

      window.addEventListener("mousemove", resetIdleTimer);
      window.addEventListener("mousedown", resetIdleTimer);
      window.addEventListener("touchstart", resetIdleTimer);
      window.addEventListener("keydown", resetIdleTimer);

      /* =========================================================
         QUEUE & NOW PLAYING CONTROLLER
         ========================================================= */
      let queue = [];
      let currentTrackIdx = -1;
      let shuffleBag = [];

      const fileUploadFiles = document.getElementById("file-upload-files");
      const fileUploadDir = document.getElementById("file-upload-dir");
      const fileImportViz = document.getElementById("file-import-viz");
      const queueContainer = document.getElementById("queue-container");
      const displayTitle = document.getElementById("display-title");
      const displayArtist = document.getElementById("display-artist");
      const displayTime = document.getElementById("display-time");
      const artImg = document.getElementById("art-img");
      const artPlaceholder = document.getElementById("art-placeholder");
      const titleBox = document.getElementById("title-box");

      const btnPlay = document.getElementById("btn-play");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");
      const btnShuffle = document.getElementById("btn-shuffle");
      const btnRepeat = document.getElementById("btn-repeat");
      const btnClearQueue = document.getElementById("btn-clear-queue");
      const btnFullscreen = document.getElementById("btn-fullscreen");
      const sliderSeek = document.getElementById("slider-seek");
      const sliderVol = document.getElementById("slider-volume");

      async function appendAudioFiles(files) {
        if (!files || !files.length) return;
        const incoming = Array.from(files).filter(f => f.type.startsWith("audio/") || /\.(mp3|wav|ogg|flac|m4a)$/i.test(f.name));
        if (!incoming.length) return;

        const wasEmpty = queue.length === 0;

        for (const f of incoming) {
          const fallback = parseTrackMeta(f.name);
          const trackItem = {
            title: fallback.title,
            artist: fallback.artist,
            albumArtUrl: null,
            file: f,
            url: null
          };

          queue.push(trackItem);
          const itemIndex = queue.length - 1;

          readID3Tags(f).then((tags) => {
            if (tags.title) trackItem.title = tags.title;
            if (tags.artist) trackItem.artist = tags.artist;
            if (tags.albumArtUrl) trackItem.albumArtUrl = tags.albumArtUrl;

            if (currentTrackIdx === itemIndex) {
              displayTitle.textContent = trackItem.title;
              displayArtist.textContent = trackItem.artist;
              updateArtThumbnail(trackItem.albumArtUrl);
              checkMarquee();
            }
            renderQueue();
          });
        }

        renderQueue();

        if (wasEmpty && currentTrackIdx === -1) {
          loadTrack(0, true);
        }
      }

      function updateArtThumbnail(artUrl) {
        if (artUrl) {
          artImg.src = artUrl;
          artImg.style.display = "block";
          artPlaceholder.style.display = "none";
        } else {
          artImg.src = "";
          artImg.style.display = "none";
          artPlaceholder.style.display = "block";
        }
      }

      if (fileUploadFiles) fileUploadFiles.addEventListener("change", (e) => appendAudioFiles(e.target.files));
      if (fileUploadDir) fileUploadDir.addEventListener("change", (e) => appendAudioFiles(e.target.files));

      if (fileImportViz) {
        fileImportViz.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const content = event.target.result;
              const parsed = JSON.parse(content);
              if (parsed.speed) appState.speed = parseFloat(parsed.speed);
              if (parsed.reactivity) appState.reactivity = parseFloat(parsed.reactivity);
              if (parsed.hue) applyAppHue(parseInt(parsed.hue, 10));
              if (parsed.density) appState.density = parseFloat(parsed.density);
              if (parsed.mode && MODES.includes(parsed.mode)) appState.mode = parsed.mode;
              saveConfig();
              loadSavedConfig();
            } catch (_) {
              appState.mode = "quantum";
              saveConfig();
              loadSavedConfig();
            }
          };
          reader.readAsText(file);
        });
      }

      function renderQueue() {
        if (!queueContainer) return;
        queueContainer.innerHTML = "";
        if (!queue.length) {
          queueContainer.innerHTML = `<div class="empty-msg">No tracks loaded.<br>Add audio files or folders to begin.</div>`;
          return;
        }

        queue.forEach((item, idx) => {
          const el = document.createElement("div");
          el.className = `queue-item ${idx === currentTrackIdx ? "active" : ""}`;

          const spanTitle = document.createElement("span");
          spanTitle.className = "queue-title";
          spanTitle.textContent = `${idx + 1}. ${item.artist} - ${item.title}`;
          spanTitle.addEventListener("click", () => loadTrack(idx, true));

          const btnRemove = document.createElement("button");
          btnRemove.className = "btn-remove-track";
          btnRemove.innerHTML = "✕";
          btnRemove.title = "Remove Track";
          btnRemove.addEventListener("click", (e) => {
            e.stopPropagation();
            removeTrack(idx);
          });

          el.appendChild(spanTitle);
          el.appendChild(btnRemove);
          queueContainer.appendChild(el);
        });
      }

      function removeTrack(idx) {
        if (idx < 0 || idx >= queue.length) return;
        if (queue[idx].url) URL.revokeObjectURL(queue[idx].url);
        if (queue[idx].albumArtUrl) URL.revokeObjectURL(queue[idx].albumArtUrl);

        if (idx === currentTrackIdx) {
          audio.pause();
          audio.src = "";
          queue.splice(idx, 1);
          if (queue.length > 0) {
            loadTrack(Math.min(idx, queue.length - 1), true);
          } else {
            currentTrackIdx = -1;
            displayTitle.textContent = "READY";
            displayArtist.textContent = "Select a track";
            updateArtThumbnail(null);
            btnPlay.textContent = "Play";
            renderQueue();
          }
        } else {
          if (idx < currentTrackIdx) currentTrackIdx--;
          queue.splice(idx, 1);
          renderQueue();
        }
      }

      if (btnClearQueue) {
        btnClearQueue.addEventListener("click", () => {
          audio.pause();
          audio.src = "";
          queue.forEach(t => {
            if (t.url) URL.revokeObjectURL(t.url);
            if (t.albumArtUrl) URL.revokeObjectURL(t.albumArtUrl);
          });
          queue = [];
          currentTrackIdx = -1;
          displayTitle.textContent = "READY";
          displayArtist.textContent = "Select a track";
          displayTime.textContent = "00:00 / 00:00";
          updateArtThumbnail(null);
          btnPlay.textContent = "Play";
          renderQueue();
        });
      }

      function loadTrack(idx, autoPlay = false) {
        if (idx < 0 || idx >= queue.length) return;

        initAudioGraph();

        if (currentTrackIdx !== -1 && queue[currentTrackIdx] && queue[currentTrackIdx].url) {
          URL.revokeObjectURL(queue[currentTrackIdx].url);
          queue[currentTrackIdx].url = null;
        }

        currentTrackIdx = idx;
        const track = queue[currentTrackIdx];
        track.url = URL.createObjectURL(track.file);

        audio.src = track.url;
        displayTitle.textContent = track.title;
        displayArtist.textContent = track.artist;
        updateArtThumbnail(track.albumArtUrl);
        checkMarquee();
        renderQueue();

        if (autoPlay) {
          audio.play().catch(e => console.warn("Auto-play gesture required:", e));
          btnPlay.textContent = "Pause";
          resetIdleTimer();
        }
      }

      function checkMarquee() {
        if (!displayTitle || !titleBox) return;
        displayTitle.classList.remove("marquee");
        if (displayTitle.offsetWidth > titleBox.offsetWidth) {
          displayTitle.classList.add("marquee");
        }
      }
      window.addEventListener("resize", checkMarquee);

      /* =========================================================
         TRANSPORT CONTROLS
         ========================================================= */
      btnPlay.addEventListener("click", () => {
        initAudioGraph();
        if (!queue.length) return;

        if (audio.paused) {
          audio.play();
          btnPlay.textContent = "Pause";
          resetIdleTimer();
        } else {
          audio.pause();
          btnPlay.textContent = "Play";
          hudLayer.classList.remove("hud-idle");
        }
      });

      function advanceTrack(direction = 1) {
        if (!queue.length) return;

        if (appState.shuffle) {
          if (!shuffleBag.length) {
            shuffleBag = queue.map((_, i) => i).filter(i => i !== currentTrackIdx);
          }
          if (shuffleBag.length) {
            const randBagIdx = Math.floor(Math.random() * shuffleBag.length);
            const nextIdx = shuffleBag.splice(randBagIdx, 1)[0];
            loadTrack(nextIdx, true);
            return;
          }
        }

        let targetIdx = currentTrackIdx + direction;
        if (targetIdx >= queue.length) {
          if (appState.repeat === "all") targetIdx = 0;
          else return;
        } else if (targetIdx < 0) {
          targetIdx = queue.length - 1;
        }

        loadTrack(targetIdx, true);
      }

      btnNext.addEventListener("click", () => advanceTrack(1));
      btnPrev.addEventListener("click", () => advanceTrack(-1));

      btnShuffle.addEventListener("click", () => {
        appState.shuffle = !appState.shuffle;
        shuffleBag = [];
        updateShuffleBtn();
        saveConfig();
      });

      function updateShuffleBtn() {
        btnShuffle.classList.toggle("active-toggle", appState.shuffle);
      }

      btnRepeat.addEventListener("click", () => {
        if (appState.repeat === "off") appState.repeat = "one";
        else if (appState.repeat === "one") appState.repeat = "all";
        else appState.repeat = "off";
        updateRepeatBtn();
        saveConfig();
      });

      function updateRepeatBtn() {
        btnRepeat.textContent = `🔁 ${appState.repeat.toUpperCase()}`;
        btnRepeat.classList.toggle("active-toggle", appState.repeat !== "off");
      }

      audio.addEventListener("ended", () => {
        if (appState.repeat === "one") {
          audio.currentTime = 0;
          audio.play();
        } else {
          advanceTrack(1);
        }
      });

      audio.addEventListener("timeupdate", () => {
        if (!audio.duration) return;
        sliderSeek.value = (audio.currentTime / audio.duration) * 100;
        displayTime.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      });

      sliderSeek.addEventListener("input", (e) => {
        if (audio.duration) {
          audio.currentTime = (parseFloat(e.target.value) / 100) * audio.duration;
        }
      });

      sliderVol.addEventListener("input", (e) => {
        const vol = parseFloat(e.target.value);
        appState.volume = vol;
        if (gainNode) gainNode.gain.value = vol;
        saveConfig();
      });

      btnFullscreen.addEventListener("click", toggleFullscreen);
      window.addEventListener("keydown", (e) => {
        if (e.key === "F11") {
          e.preventDefault();
          toggleFullscreen();
        }
      });

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          btnFullscreen.textContent = "Exit Full";
        } else {
          document.exitFullscreen().catch(() => {});
          btnFullscreen.textContent = "⛶ Fullscreen";
        }
      }

      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }

      /* =========================================================
         ENGINE SELECTION & CONTROLS
         ========================================================= */
      const selectEngine = document.getElementById("select-engine");
      const quickVizName = document.getElementById("quick-viz-name");
      const btnQuickPrev = document.getElementById("btn-quick-prev");
      const btnQuickNext = document.getElementById("btn-quick-next");
      const sliderSpeed = document.getElementById("slider-speed");
      const sliderDensity = document.getElementById("slider-density");
      const sliderHue = document.getElementById("slider-app-hue");
      const sliderReactivity = document.getElementById("slider-reactivity");
      const btnSavePreset = document.getElementById("btn-save-preset");

      function setVisualizerMode(mode) {
        if (!MODES.includes(mode)) return;
        appState.mode = mode;
        if (selectEngine) selectEngine.value = mode;
        updateQuickVizTitle();
        saveConfig();
      }

      function updateQuickVizTitle() {
        if (quickVizName) quickVizName.textContent = appState.mode.toUpperCase();
      }

      if (selectEngine) selectEngine.addEventListener("change", (e) => setVisualizerMode(e.target.value));

      if (btnQuickNext) {
        btnQuickNext.addEventListener("click", () => {
          const idx = (MODES.indexOf(appState.mode) + 1) % MODES.length;
          setVisualizerMode(MODES[idx]);
        });
      }

      if (btnQuickPrev) {
        btnQuickPrev.addEventListener("click", () => {
          const idx = (MODES.indexOf(appState.mode) - 1 + MODES.length) % MODES.length;
          setVisualizerMode(MODES[idx]);
        });
      }

      if (sliderSpeed) {
        sliderSpeed.addEventListener("input", (e) => {
          appState.speed = parseFloat(e.target.value);
          saveConfig();
        });
      }

      if (sliderDensity) {
        sliderDensity.addEventListener("input", (e) => {
          appState.density = parseFloat(e.target.value);
          saveConfig();
        });
      }

      if (sliderHue) {
        sliderHue.addEventListener("input", (e) => {
          applyAppHue(parseInt(e.target.value, 10));
          saveConfig();
        });
      }

      if (sliderReactivity) {
        sliderReactivity.addEventListener("input", (e) => {
          appState.reactivity = parseFloat(e.target.value);
          saveConfig();
        });
      }

      if (btnSavePreset) {
        btnSavePreset.addEventListener("click", () => {
          saveConfig();
          btnSavePreset.textContent = "Saved!";
          setTimeout(() => btnSavePreset.textContent = "Save Deck", 1200);
        });
      }

      /* =========================================================
         CANVAS ENGINE (PROTECTED INITIALIZATION + SPEED)
         ========================================================= */
      const canvas = document.getElementById("visualizer-canvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = window.innerWidth || 1280;
        canvas.height = window.innerHeight || 720;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      const MAX_PARTICLES = 500;
      const particles = Array.from({ length: MAX_PARTICLES }, () => ({
        x: (Math.random() - 0.5) * 1600,
        y: (Math.random() - 0.5) * 1200,
        z: Math.random() * 1000 + 1,
        angle: Math.random() * Math.PI * 2,
        radius: Math.random() * 450 + 40
      }));

      const barPeaks = new Array(64).fill(0);
      let globalTick = 0;

      function renderFrame() {
        requestAnimationFrame(renderFrame);

        let bass = 0;
        let mid = 0;

        if (analyser && freqData && timeData) {
          analyser.getByteFrequencyData(freqData);
          analyser.getByteTimeDomainData(timeData);

          let bSum = 0; for (let i = 0; i < 20; i++) bSum += freqData[i];
          bass = (bSum / 20) / 255;

          let mSum = 0; for (let i = 20; i < 90; i++) mSum += freqData[i];
          mid = (mSum / 70) / 255;
        }

        const effectiveBass = bass * appState.reactivity;
        const activeCount = Math.floor(250 * appState.density);
        const cx = (canvas.width || 1280) / 2;
        const cy = (canvas.height || 720) / 2;
        const currentHue = appState.hue;
        const speedMult = appState.speed || 1.0;

        ctx.fillStyle = "rgba(7, 7, 11, 0.28)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        globalTick += (0.01 + (effectiveBass * 0.04)) * speedMult;

        switch (appState.mode) {
          case "vortex": {
            ctx.save();
            ctx.translate(cx, cy);
            for (let i = 0; i < activeCount; i++) {
              const p = particles[i];
              p.angle += (0.006 + (effectiveBass * 0.02)) * speedMult;
              const r = p.radius + Math.sin(globalTick + i) * 35 * effectiveBass;
              const px = Math.cos(p.angle) * r;
              const py = Math.sin(p.angle) * r;

              const hue = (currentHue + (i * 0.5) + (effectiveBass * 60)) % 360;
              ctx.strokeStyle = `hsla(${hue}, 90%, 55%, ${0.3 + effectiveBass * 0.7})`;
              ctx.lineWidth = 1.2 + effectiveBass * 3;

              ctx.beginPath();
              ctx.arc(px, py, 2 + effectiveBass * 6, 0, Math.PI * 2);
              ctx.stroke();
            }
            ctx.restore();
            break;
          }

          case "warp": {
            ctx.save();
            ctx.translate(cx, cy);
            const warpSpeed = (8 + (effectiveBass * 45)) * speedMult;
            for (let i = 0; i < activeCount; i++) {
              const p = particles[i];
              const prevZ = p.z;
              p.z -= warpSpeed;

              if (p.z <= 1) {
                p.z = 1000;
                p.x = (Math.random() - 0.5) * canvas.width * 2;
                p.y = (Math.random() - 0.5) * canvas.height * 2;
                continue;
              }

              const k = 220 / p.z;
              const px = p.x * k;
              const py = p.y * k;

              const pk = 220 / prevZ;
              const ppx = p.x * pk;
              const ppy = p.y * pk;

              const bright = (1 - p.z / 1000);
              ctx.strokeStyle = `rgba(255, 255, 255, ${bright * (0.4 + effectiveBass * 0.6)})`;
              ctx.lineWidth = Math.max(1, (1 - p.z / 1000) * 3 * (1 + effectiveBass * 0.8));

              ctx.beginPath();
              ctx.moveTo(ppx, ppy);
              ctx.lineTo(px, py);
              ctx.stroke();
            }
            ctx.restore();
            break;
          }

          case "bars": {
            ctx.save();
            const barCount = Math.floor(48 * Math.min(1.5, appState.density));
            const totalWidth = canvas.width * 0.75;
            const barWidth = (totalWidth / barCount) * 0.7;
            const gap = (totalWidth / barCount) * 0.3;
            const startX = (canvas.width - totalWidth) / 2;
            const baseHeight = canvas.height * 0.65;

            for (let i = 0; i < barCount; i++) {
              const freqVal = freqData ? (freqData[i * 2] / 255) : 0;
              const h = Math.max(4, freqVal * baseHeight * appState.reactivity);
              const x = startX + i * (barWidth + gap);
              const y = canvas.height * 0.78 - h;

              if (h > barPeaks[i]) barPeaks[i] = h;
              else barPeaks[i] = Math.max(0, barPeaks[i] - 3.5 * speedMult);

              const hue = (currentHue + (i * 3)) % 360;
              ctx.fillStyle = `hsl(${hue}, 95%, 60%)`;
              ctx.fillRect(x, y, barWidth, h);

              ctx.fillStyle = "#ffffff";
              ctx.fillRect(x, canvas.height * 0.78 - barPeaks[i] - 3, barWidth, 3);
            }
            ctx.restore();
            break;
          }

          case "cybergrid": {
            ctx.save();
            const horizon = cy + Math.sin(globalTick) * 20 * effectiveBass;
            ctx.strokeStyle = `hsla(${currentHue}, 90%, 55%, ${0.3 + effectiveBass * 0.6})`;
            ctx.lineWidth = 1.2 + effectiveBass * 2.5;

            const cols = Math.floor(22 * appState.density);
            for (let i = -cols; i <= cols; i++) {
              ctx.beginPath();
              ctx.moveTo(cx + (i * 12), horizon);
              ctx.lineTo(cx + (i * 90) * (1 + effectiveBass * 0.3), canvas.height);
              ctx.stroke();
            }

            const rows = Math.floor(14 * appState.density);
            for (let i = 0; i < rows; i++) {
              const yProg = Math.pow((i + (globalTick * 3) % 1) / rows, 2);
              const lineY = horizon + yProg * (canvas.height - horizon);
              
              ctx.beginPath();
              for (let x = 0; x <= canvas.width; x += 30) {
                const waveKick = Math.sin((x * 0.01) + globalTick * 4) * 25 * effectiveBass;
                if (x === 0) ctx.moveTo(x, lineY + waveKick);
                else ctx.lineTo(x, lineY + waveKick);
              }
              ctx.stroke();
            }
            ctx.restore();
            break;
          }

          case "nebula": {
            ctx.save();
            ctx.translate(cx, cy);
            const cloudCount = Math.floor(8 * appState.density);
            for (let i = 0; i < cloudCount; i++) {
              const angle = (i / cloudCount) * Math.PI * 2 + globalTick * 0.4;
              const dist = 120 + Math.sin(globalTick + i) * 80 * effectiveBass;
              const x = Math.cos(angle) * dist;
              const y = Math.sin(angle) * dist;

              const grad = ctx.createRadialGradient(x, y, 10, x, y, 170 + effectiveBass * 140);
              const hue = (currentHue + i * 28) % 360;
              grad.addColorStop(0, `hsla(${hue}, 95%, 55%, ${0.28 + effectiveBass * 0.45})`);
              grad.addColorStop(1, "rgba(7, 7, 11, 0)");

              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(x, y, 210 + effectiveBass * 140, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
            break;
          }

          case "starfield": {
            ctx.save();
            ctx.translate(cx, cy);
            for (let i = 0; i < activeCount; i++) {
              const p = particles[i];
              p.z -= (4 + (effectiveBass * 28)) * speedMult;
              if (p.z <= 1) {
                p.z = 1000;
                p.x = (Math.random() - 0.5) * canvas.width * 2;
                p.y = (Math.random() - 0.5) * canvas.height * 2;
              }

              const k = 250 / p.z;
              const px = p.x * k;
              const py = p.y * k;
              const size = Math.max(1, (1 - p.z / 1000) * 5 * (1 + effectiveBass * 1.5));

              const hue = (currentHue + (1 - p.z / 1000) * 80) % 360;
              ctx.fillStyle = `hsla(${hue}, 90%, 65%, ${1 - p.z / 1000})`;
              ctx.beginPath();
              ctx.arc(px, py, size, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
            break;
          }

          case "ring": {
            ctx.save();
            ctx.translate(cx, cy);
            const baseRadius = Math.min(cx, cy) * 0.4;
            const points = Math.floor(120 * appState.density);
            ctx.beginPath();
            for (let i = 0; i <= points; i++) {
              const angle = (i / points) * Math.PI * 2;
              const freqVal = freqData ? (freqData[i % freqData.length] / 255) : 0;
              const r = baseRadius + (freqVal * 130 * effectiveBass);
              const x = Math.cos(angle) * r;
              const y = Math.sin(angle) * r;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.strokeStyle = `hsl(${currentHue}, 100%, 60%)`;
            ctx.lineWidth = 2 + effectiveBass * 4;
            ctx.stroke();
            ctx.restore();
            break;
          }

          case "tunnel": {
            ctx.save();
            ctx.translate(cx, cy);
            const rings = Math.floor(12 * appState.density);
            for (let i = 1; i <= rings; i++) {
              const progress = (i / rings + (globalTick * 0.5)) % 1;
              const r = progress * Math.min(cx, cy) * 1.3;
              const alpha = progress * (0.2 + effectiveBass * 0.8);
              ctx.beginPath();
              ctx.arc(0, 0, Math.max(2, r), 0, Math.PI * 2);
              ctx.strokeStyle = `hsla(${(currentHue + i * 15) % 360}, 95%, 60%, ${alpha})`;
              ctx.lineWidth = 1.5 + (effectiveBass * 3);
              ctx.stroke();
            }
            ctx.restore();
            break;
          }

          case "oscilloscope": {
            if (!timeData) break;
            ctx.save();
            ctx.beginPath();
            const sliceWidth = canvas.width / timeData.length;
            let x = 0;
            for (let i = 0; i < timeData.length; i++) {
              const v = (timeData[i] / 128.0) - 1.0;
              const y = cy + (v * cy * 0.65 * effectiveBass);
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
              x += sliceWidth;
            }
            ctx.strokeStyle = `hsl(${currentHue}, 100%, 65%)`;
            ctx.lineWidth = 2.5 + effectiveBass * 3;
            ctx.stroke();
            ctx.restore();
            break;
          }

          case "quantum": {
            ctx.save();
            ctx.translate(cx, cy);
            const pulseCount = Math.floor(7 * appState.density);
            for (let i = 0; i < pulseCount; i++) {
              const pulseRadius = (Math.sin(globalTick + i * 0.8) * 0.5 + 0.5) * Math.min(cx, cy) * 0.7;
              const dynamicRadius = pulseRadius * (1 + effectiveBass * 0.6);
              ctx.beginPath();
              ctx.arc(0, 0, Math.max(1, dynamicRadius), 0, Math.PI * 2);
              ctx.strokeStyle = `hsla(${(currentHue + i * 40) % 360}, 90%, 60%, ${0.3 + effectiveBass * 0.6})`;
              ctx.lineWidth = 2 + effectiveBass * 4;
              ctx.stroke();
            }
            ctx.restore();
            break;
          }
        }
      }

      loadSavedConfig();
      renderFrame();
    });
  </script>
</body>
</html>
